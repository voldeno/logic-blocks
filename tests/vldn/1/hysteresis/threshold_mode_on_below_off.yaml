name: "threshold mode on < off (inverted)"

config:
  mode: "Threshold (On/Off)"
  value_on: 45.0
  value_off: 55.0

steps:
  - action: "set_inputs"
    comment: "Reset to high value"
    inputs:
      value: 100.0

  - action: "assert_outputs"
    comment: "Output should be off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value above value_off"
    inputs:
      value: 60.0

  - action: "assert_outputs"
    comment: "Output still off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value at value_off"
    inputs:
      value: 55.0

  - action: "assert_outputs"
    comment: "Output still off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value in hysteresis range"
    inputs:
      value: 50.0

  - action: "assert_outputs"
    comment: "Output still off (in hysteresis)"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value just above value_on"
    inputs:
      value: 45.1

  - action: "assert_outputs"
    comment: "Output still off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value at value_on"
    inputs:
      value: 45.0

  - action: "assert_outputs"
    comment: "Output turns on"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value below value_on"
    inputs:
      value: 40.0

  - action: "assert_outputs"
    comment: "Output stays on"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value back in hysteresis range"
    inputs:
      value: 50.0

  - action: "assert_outputs"
    comment: "Output stays on (in hysteresis)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value just below value_off"
    inputs:
      value: 54.9

  - action: "assert_outputs"
    comment: "Output stays on (in hysteresis)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value at value_off"
    inputs:
      value: 55.0

  - action: "assert_outputs"
    comment: "Output turns off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value above value_off"
    inputs:
      value: 60.0

  - action: "assert_outputs"
    comment: "Output stays off"
    expected_outputs:
      output: false
