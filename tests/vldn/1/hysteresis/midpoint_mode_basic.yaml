name: "midpoint mode basic"

config:
  mode: "Midpoint + Hysteresis"
  midpoint: 50.0
  hysteresis: 5.0

steps:
  - action: "set_inputs"
    comment: "Reset to low value"
    inputs:
      value: 0.0

  - action: "assert_outputs"
    comment: "Output should be off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value below lower threshold"
    inputs:
      value: 44.0

  - action: "assert_outputs"
    comment: "Output still off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value at lower threshold"
    inputs:
      value: 45.0

  - action: "assert_outputs"
    comment: "Output still off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value in hysteresis range"
    inputs:
      value: 50.0

  - action: "assert_outputs"
    comment: "Output still off (in hysteresis)"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value in hysteresis range, close to upper threshold"
    inputs:
      value: 54.9

  - action: "assert_outputs"
    comment: "Output still off (in hysteresis)"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value at upper threshold"
    inputs:
      value: 55.0

  - action: "assert_outputs"
    comment: "Output turns on"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value above upper threshold"
    inputs:
      value: 60.0

  - action: "assert_outputs"
    comment: "Output stays on"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value back in hysteresis range"
    inputs:
      value: 54.9

  - action: "assert_outputs"
    comment: "Output stays on (in hysteresis)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value at midpoint"
    inputs:
      value: 50.0

  - action: "assert_outputs"
    comment: "Output stays on (in hysteresis)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value at lower threshold"
    inputs:
      value: 45.0

  - action: "assert_outputs"
    comment: "Output turns off"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value below lower threshold"
    inputs:
      value: 40.0

  - action: "assert_outputs"
    comment: "Output stays off"
    expected_outputs:
      output: false
