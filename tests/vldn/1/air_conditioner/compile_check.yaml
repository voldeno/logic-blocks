name: "compile check"

config:
  min_target_temp: 16
  max_target_temp: 30
  refresh_interval: 60
  resend_on_refresh: false

steps:
  - action: "assert_outputs"
    comment: "Default outputs on startup"
    expected_outputs:
      power: false
      mode: 0
      target_temp: 0
      room_temp: -1000
      fault: 0
