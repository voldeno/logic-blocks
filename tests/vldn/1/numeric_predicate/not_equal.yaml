name: "not equal"

config:
  operator: 3 # Not equal
  operand: 10.0

steps:
  - action: "set_inputs"
    comment: "Value below operand"
    inputs:
      value: 9.99

  - action: "assert_outputs"
    comment: "Output true (not equal)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value equal to operand"
    inputs:
      value: 10.0

  - action: "assert_outputs"
    comment: "Output false (equal)"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Value above operand"
    inputs:
      value: 10.01

  - action: "assert_outputs"
    comment: "Output true (not equal)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value is zero"
    inputs:
      value: 0.0

  - action: "assert_outputs"
    comment: "Output true (not equal)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Negative value"
    inputs:
      value: -10.0

  - action: "assert_outputs"
    comment: "Output true (not equal)"
    expected_outputs:
      output: true
