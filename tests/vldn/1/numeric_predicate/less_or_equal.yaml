name: "less or equal"

config:
  operator: 5 # Less or equal
  operand: 10.0

steps:
  - action: "set_inputs"
    comment: "Value below operand"
    inputs:
      value: 9.99

  - action: "assert_outputs"
    comment: "Output true"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value equal to operand"
    inputs:
      value: 10.0

  - action: "assert_outputs"
    comment: "Output true (equal counts)"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value above operand"
    inputs:
      value: 10.01

  - action: "assert_outputs"
    comment: "Output false"
    expected_outputs:
      output: false

  - action: "set_inputs"
    comment: "Negative value, below operand"
    inputs:
      value: -5.0

  - action: "assert_outputs"
    comment: "Output true"
    expected_outputs:
      output: true

  - action: "set_inputs"
    comment: "Value well above operand"
    inputs:
      value: 100.0

  - action: "assert_outputs"
    comment: "Output false"
    expected_outputs:
      output: false
