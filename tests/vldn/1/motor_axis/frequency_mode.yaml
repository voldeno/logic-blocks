name: "frequency control mode"

config:
  home_direction: 0
  position_tolerance: 0
  control_mode: 2

steps:
  # Home first
  - action: "set_inputs"
    comment: "Trigger homing"
    inputs:
      home: true

  - action: "set_inputs"
    inputs:
      home: false

  - action: "set_inputs"
    comment: "Home switch activates"
    inputs:
      home_switch: true

  - action: "assert_outputs"
    comment: "Homing complete"
    expected_outputs:
      homed: true
      position: 0
      at_target: true

  - action: "set_inputs"
    inputs:
      home_switch: false

  # Set target to 10
  - action: "set_inputs"
    comment: "Set target to 10"
    inputs:
      target: 10

  - action: "assert_outputs"
    comment: "Motor starts forward"
    expected_outputs:
      forward: true
      reverse: false
      moving: true
      at_target: false

  # First frequency input after 350ms: 10 Hz
  # pulses = 10 * 350/1000 = 3.5, floor = 3, fractional = 0.5
  - action: "wait"
    duration_ms: 350

  - action: "set_inputs"
    comment: "Freq input: 10 Hz, floor(3.5) = 3 whole pulses"
    inputs:
      freq: 10

  - action: "assert_outputs"
    comment: "Position advanced to 3"
    expected_outputs:
      position: 3
      forward: true
      moving: true
      at_target: false

  # Second frequency input after another 350ms: 10 Hz
  # pulses = 10 * 350/1000 + 0.5 = 4.0, floor = 4, position = 7
  # remaining = 3, avg_pulse_time = 100ms, remaining_time = 300ms < 350ms
  # -> finish callback scheduled at ~300ms
  - action: "wait"
    duration_ms: 350

  - action: "set_inputs"
    comment: "Freq input: 10 Hz, 4 whole pulses with fractional carry, finish triggered"
    inputs:
      freq: 10

  - action: "assert_outputs"
    comment: "Position advanced to 7, motor still running (finish callback pending)"
    expected_outputs:
      position: 7
      forward: true
      moving: true
      at_target: false

  # Wait for finish callback (~300ms) to fire
  - action: "wait"
    duration_ms: 350

  - action: "assert_outputs"
    comment: "Finish callback fired, position set to target, motor stopped"
    expected_outputs:
      position: 10
      forward: false
      reverse: false
      moving: false
      at_target: true
