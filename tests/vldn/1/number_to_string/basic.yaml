name: "basic"

config: {}

steps:
  - action: "set_inputs"
    comment: "Set value to 3.14"
    inputs:
      value: 3.14

  - action: "assert_outputs"
    comment: "Decimal value converted"
    expected_outputs:
      text: "3.140000"

  - action: "set_inputs"
    comment: "Set value to -7"
    inputs:
      value: -7

  - action: "assert_outputs"
    comment: "Negative integer"
    expected_outputs:
      text: "-7"

  - action: "set_inputs"
    comment: "Set value to 42"
    inputs:
      value: 42

  - action: "assert_outputs"
    comment: "Positive integer"
    expected_outputs:
      text: "42"
