      climate_control: 2.5

  - action: "set_inputs"
    comment: "Current temperature: 17.5'"
    inputs:
      air_temp: 17.5

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 3.0"
    expected_outputs:
      climate_control: 3.0

  - action: "set_inputs"
    comment: "Current temperature: 16.0'"
    inputs:
      air_temp: 16.0

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 4.5"
    expected_outputs:
      climate_control: 4.5

  - action: "set_inputs"
    comment: "Current temperature: 16.11'"
    inputs:
      air_temp: 16.11

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 4.39"
    expected_outputs:
      climate_control: 4.39

  - action: "set_inputs"
    comment: "Current temperature: 22.5'"
    inputs:
      air_temp: 22.5

  - action: "assert_outputs"
    comment: "CC out is in idle mode as air_temp = fixed_temp - 0.0"
    expected_outputs:
      climate_control: 0

  - action: "set_inputs"
    comment: "Current temperature: 25.5'"
    inputs:
      air_temp: 25.5

  - action: "assert_outputs"
    comment: "CC out is in idle mode as air_temp = fixed_temp - 0.0"
