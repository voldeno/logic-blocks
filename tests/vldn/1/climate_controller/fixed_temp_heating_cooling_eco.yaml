name: "fixed temperature, heating & cooling, eco"

config:
  thermal_mode: 0 # heating and cooling
  operation_mode: 1 # manual
  fixed_temp: 21.5
  comfort_heating_temp: 22.5
  comfort_cooling_temp: 24.5
  eco_heating_temp_diff: 2
  eco_cooling_temp_diff: 3

steps:
  - action: "set_inputs"
    comment: "Current temperature: 21.5'"
    inputs:
      air_temp: 21.5

  - action: "assert_outputs"
    comment: "CC out is in idle mode as air_temp = fixed_temp - 0.0"
    expected_outputs:
      climate_control: 0

  - action: "set_inputs"
    comment: "Enable eco temperature mode"
    inputs:
      eco: 1

  - action: "assert_outputs"
    comment: "CC out is in idle mode as air_temp < fixed_temp - 0.0"
    expected_outputs:
      climate_control: 0.0

  - action: "set_inputs"
    comment: "Current temperature: 19.0'"
    inputs:
      air_temp: 19.0

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 1.5"
    expected_outputs:
      climate_control: 1.5

  - action: "set_inputs"
    comment: "Current temperature: 18.5'"
    inputs:
      air_temp: 18.5

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 2.0"
    expected_outputs:
      climate_control: 2.0

  - action: "set_inputs"
    comment: "Current temperature: 18.0'"
    inputs:
      air_temp: 18.0

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 2.5"
    expected_outputs:
      climate_control: 2.5

  - action: "set_inputs"
    comment: "Disable eco temperature mode"
    inputs:
      eco: 0

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 3.5"
    expected_outputs:
      climate_control: 3.5

  - action: "set_inputs"
    comment: "Enable eco temperature mode"
    inputs:
      eco: 1

  - action: "assert_outputs"
    comment: "CC out is in heating mode as air_temp < fixed_temp - 2.5"
