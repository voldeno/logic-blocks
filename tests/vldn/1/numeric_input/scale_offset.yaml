name: "base scenario"

config:
  scale: 0.1
  offset: 1.1

steps:
  - action: "set_inputs"
    comment: "Register to 1000"
    inputs:
      register: 1000

  - action: "assert_outputs"
    comment: "Output is 1.2"
    expected_outputs:
      value: 1.2

  - action: "set_inputs"
    comment: "Register to 2500"
    inputs:
      register: 2500

  - action: "assert_outputs"
    comment: "Output is 1.35"
    expected_outputs:
      value: 1.35

  - action: "set_inputs"
    comment: "Register to -13755"
    inputs:
      register: -13755

  - action: "assert_outputs"
    comment: "Output is -0.276"
    expected_outputs:
      value: -0.276
