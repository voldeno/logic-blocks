name: "single control open/stop/close - full travel"

config:
  control_mode: 1 # single control: open/stop/close
  motor_lock_duration: 0
  opening_duration: 1
  closing_duration: 1
  pulse_duration: 0.2
  pulse_pause: 0.2

  use_sensors: false
steps:
  - action: "set_inputs"
    comment: "Open pulse - high"
    inputs:
      open: true

  - action: "assert_outputs"
    comment: "Control pulse emitted, gate opening"
    expected_outputs:
      control: true
      open: false
      close: false
      moving: true
      gate_state: 1

  - action: "set_inputs"
    comment: "Open pulse - low"
    inputs:
      open: false

  - action: "wait"
    comment: "Wait past the pulse duration"
    duration_ms: 300

  - action: "assert_outputs"
    comment: "Control pulse finished, still opening"
    expected_outputs:
      control: false
      moving: true
      gate_state: 1

  - action: "wait"
    comment: "Wait for the rest of the opening duration"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "Fully open - controller assumed to stop at the limit"
    expected_outputs:
      control: false
      moving: false
      position: 100
      gate_state: 2

  - action: "set_inputs"
    comment: "Close pulse - high"
    inputs:
      close: true

  - action: "assert_outputs"
    comment: "After reaching the limit the next controller action is close - one pulse suffices"
    expected_outputs:
      control: true
      moving: true
      gate_state: 3

  - action: "set_inputs"
    comment: "Close pulse - low"
    inputs:
      close: false

  - action: "wait"
    comment: "Wait for the full closing duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Fully closed"
    expected_outputs:
      control: false
      moving: false
      position: 0
      gate_state: 0
