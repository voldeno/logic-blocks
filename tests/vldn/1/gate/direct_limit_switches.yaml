name: "direct motor control - limit switches correct position and detect external movement"

config:
  control_mode: 0 # direct motor control
  opening_duration: 5
  closing_duration: 5
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Open pulse - high"
    inputs:
      open: true

  - action: "set_inputs"
    comment: "Open pulse - low"
    inputs:
      open: false

  - action: "wait"
    comment: "Open a little (3 ticks of 2%)"
    duration_ms: 320

  - action: "assert_outputs"
    comment: "Opening in progress"
    expected_outputs:
      open: true
      moving: true
      position: 6
      gate_state: 1

  - action: "set_inputs"
    comment: "Open limit switch reached much earlier than the configured duration"
    inputs:
      is_open: true

  - action: "assert_outputs"
    comment: "Position corrected to fully open, motor stopped"
    expected_outputs:
      open: false
      close: false
      moving: false
      position: 100
      gate_state: 2

  - action: "set_inputs"
    comment: "Gate leaves the open limit without any command (e.g. remote control)"
    inputs:
      is_open: false

  - action: "assert_outputs"
    comment: "External closing detected"
    expected_outputs:
      moving: true
      gate_state: 3

  - action: "wait"
    comment: "Externally closing (5 ticks of 2%)"
    duration_ms: 520

  - action: "assert_outputs"
    comment: "Position is being simulated during external movement"
    expected_outputs:
      position: 90
      gate_state: 3

  - action: "set_inputs"
    comment: "Closed limit switch reached"
    inputs:
      is_closed: true

  - action: "assert_outputs"
    comment: "Position corrected to fully closed"
    expected_outputs:
      moving: false
      position: 0
      gate_state: 0
