name: "direct motor control - toggle cycles open, stop, close"

config:
  control_mode: 0 # direct motor control
  opening_duration: 1
  closing_duration: 1
  motor_lock_duration: 0

  use_sensors: false
steps:
  - action: "set_inputs"
    comment: "Toggle pulse - high"
    inputs:
      toggle: true

  - action: "assert_outputs"
    comment: "Closed gate starts opening"
    expected_outputs:
      open: true
      close: false
      moving: true
      gate_state: 1

  - action: "set_inputs"
    comment: "Toggle pulse - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Open halfway (5 ticks of 10%)"
    duration_ms: 510

  - action: "set_inputs"
    comment: "Toggle pulse while moving - high"
    inputs:
      toggle: true

  - action: "assert_outputs"
    comment: "Movement stopped midway"
    expected_outputs:
      open: false
      close: false
      moving: false
      position: 50
      gate_state: 4

  - action: "set_inputs"
    comment: "Toggle pulse while moving - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Small pause between pulses"
    duration_ms: 50

  - action: "set_inputs"
    comment: "Toggle pulse on stopped gate - high"
    inputs:
      toggle: true

  - action: "assert_outputs"
    comment: "Last movement was opening, so toggle now closes"
    expected_outputs:
      open: false
      close: true
      moving: true
      gate_state: 3

  - action: "set_inputs"
    comment: "Toggle pulse on stopped gate - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Wait for closing to complete from 50%"
    duration_ms: 700

  - action: "assert_outputs"
    comment: "Fully closed"
    expected_outputs:
      open: false
      close: false
      moving: false
      position: 0
      gate_state: 0
