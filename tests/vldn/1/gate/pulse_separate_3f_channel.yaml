name: "separate pulses - open/stop/close channel function on the open output"

config:
  control_mode: 3 # separate open and close pulses
  motor_lock_duration: 0
  open_output_function: 3 # open/stop/close cycle (3F)
  close_output_function: 1 # close (ZA)
  partial_open_position: 20
  opening_duration: 1
  closing_duration: 1
  pulse_duration: 0.2
  pulse_pause: 0.2

  use_sensors: false
steps:
  - action: "set_inputs"
    comment: "Partial open pulse on a closed gate - high"
    inputs:
      partial_open: true

  - action: "assert_outputs"
    comment: "Stop at position approach - open pulse emitted on the 3F channel"
    expected_outputs:
      open: true
      close: false
      moving: true
      gate_state: 1

  - action: "set_inputs"
    comment: "Partial open pulse - low"
    inputs:
      partial_open: false

  - action: "wait"
    comment: "Reach the partial position, stop pulse follows on the same channel"
    duration_ms: 450

  - action: "assert_outputs"
    comment: "Stopped at the partial position by a controller stop pulse"
    expected_outputs:
      open: true
      moving: false
      position: 20
      gate_state: 5

  - action: "wait"
    comment: "Wait for the stop pulse to finish"
    duration_ms: 300

  - action: "assert_outputs"
    comment: "Stop pulse finished"
    expected_outputs:
      open: false
      moving: false
      position: 20
      gate_state: 5

  - action: "wait"
    comment: "Let the pulse pause expire"
    duration_ms: 150

  - action: "set_inputs"
    comment: "Toggle pulse - high"
    inputs:
      toggle: true

  - action: "assert_outputs"
    comment: "Toggle forwarded as a raw pulse to the 3F channel - cycle continues with close"
    expected_outputs:
      open: true
      close: false
      moving: true
      gate_state: 3

  - action: "set_inputs"
    comment: "Toggle pulse - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Wait for closing to complete from 20%"
    duration_ms: 600

  - action: "assert_outputs"
    comment: "Fully closed - 3F cycle reset at the limit"
    expected_outputs:
      open: false
      close: false
      moving: false
      position: 0
      gate_state: 0

  - action: "set_inputs"
    comment: "Open pulse - high"
    inputs:
      open: true

  - action: "assert_outputs"
    comment: "Open command routed to the 3F channel - next cycle action is open after the limit reset"
    expected_outputs:
      open: true
      moving: true
      gate_state: 1

  - action: "set_inputs"
    comment: "Open pulse - low"
    inputs:
      open: false

  - action: "wait"
    comment: "Wait for full opening"
    duration_ms: 1150

  - action: "assert_outputs"
    comment: "Fully open"
    expected_outputs:
      open: false
      moving: false
      position: 100
      gate_state: 2

  - action: "set_inputs"
    comment: "Close pulse - high"
    inputs:
      close: true

  - action: "assert_outputs"
    comment: "Close command uses the dedicated close channel"
    expected_outputs:
      open: false
      close: true
      moving: true
      gate_state: 3

  - action: "set_inputs"
    comment: "Close pulse - low"
    inputs:
      close: false

  - action: "wait"
    comment: "Wait for the full closing duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Fully closed"
    expected_outputs:
      close: false
      moving: false
      position: 0
      gate_state: 0
