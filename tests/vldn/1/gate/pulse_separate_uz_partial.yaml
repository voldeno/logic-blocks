name: "separate pulses - partial open through close pulse on a closed gate (UZ mode)"

config:
  control_mode: 3 # separate open and close pulses
  partial_open_mode: 1 # close pulse when fully closed
  partial_open_position: 20
  opening_duration: 1
  closing_duration: 1
  pulse_duration: 0.2
  pulse_pause: 0.2

steps:
  - action: "set_inputs"
    comment: "Partial open pulse on a closed gate - high"
    inputs:
      partial_open: true

  - action: "assert_outputs"
    comment: "Close output pulses - the controller interprets it as partial open"
    expected_outputs:
      control: false
      open: false
      close: true
      moving: true
      gate_state: 1

  - action: "set_inputs"
    comment: "Partial open pulse - low"
    inputs:
      partial_open: false

  - action: "wait"
    comment: "Wait until the controller's partial position is reached (2 ticks of 10%)"
    duration_ms: 450

  - action: "assert_outputs"
    comment: "Gate partially open, controller stopped it on its own"
    expected_outputs:
      close: false
      moving: false
      position: 20
      gate_state: 5

  - action: "set_inputs"
    comment: "Open pulse - high"
    inputs:
      open: true

  - action: "assert_outputs"
    comment: "Open output pulses, gate opening"
    expected_outputs:
      open: true
      close: false
      moving: true
      gate_state: 1

  - action: "set_inputs"
    comment: "Open pulse - low"
    inputs:
      open: false

  - action: "wait"
    comment: "Wait for full opening from 20%"
    duration_ms: 950

  - action: "assert_outputs"
    comment: "Fully open"
    expected_outputs:
      open: false
      moving: false
      position: 100
      gate_state: 2

  - action: "set_inputs"
    comment: "Close pulse on an open gate - high"
    inputs:
      close: true

  - action: "assert_outputs"
    comment: "Close output pulses, gate closing normally"
    expected_outputs:
      close: true
      moving: true
      gate_state: 3

  - action: "set_inputs"
    comment: "Close pulse - low"
    inputs:
      close: false

  - action: "wait"
    comment: "Wait for the full closing duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Fully closed"
    expected_outputs:
      close: false
      moving: false
      position: 0
      gate_state: 0
