name: "direct motor control - off stops movement and locks commands"

config:
  control_mode: 0 # direct motor control
  opening_duration: 1
  closing_duration: 1
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Off active"
    inputs:
      off: true

  - action: "set_inputs"
    comment: "Open pulse while off is active - high"
    inputs:
      open: true

  - action: "assert_outputs"
    comment: "Command blocked by off"
    expected_outputs:
      open: false
      moving: false
      position: 0
      gate_state: 0

  - action: "set_inputs"
    comment: "Open pulse while off is active - low"
    inputs:
      open: false

  - action: "set_inputs"
    comment: "Off released"
    inputs:
      off: false

  - action: "set_inputs"
    comment: "Open pulse - high"
    inputs:
      open: true

  - action: "assert_outputs"
    comment: "Opening starts"
    expected_outputs:
      open: true
      moving: true
      gate_state: 1

  - action: "set_inputs"
    comment: "Open pulse - low"
    inputs:
      open: false

  - action: "wait"
    comment: "Open halfway (5 ticks of 10%)"
    duration_ms: 510

  - action: "set_inputs"
    comment: "Off triggers during movement"
    inputs:
      off: true

  - action: "assert_outputs"
    comment: "Movement stopped by off"
    expected_outputs:
      open: false
      close: false
      moving: false
      position: 50
      gate_state: 4
