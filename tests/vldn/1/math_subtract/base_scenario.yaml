name: "base scenario"

steps:
  - action: "set_inputs"
    inputs:
      input_1: 10
      input_2: 2

  - action: "assert_outputs"
    expected_outputs:
      output: 8

  - action: "set_inputs"
    inputs:
      input_1: 10.2

  - action: "assert_outputs"
    expected_outputs:
      output: 8.2

  - action: "set_inputs"
    inputs:
      input_1: 0.2
      input_2: -0.1

  - action: "assert_outputs"
    expected_outputs:
      output: 0.3

  - action: "set_inputs"
    inputs:
      input_1: 0
      input_2: 0

  - action: "assert_outputs"
    expected_outputs:
      output: 0

  - action: "set_inputs"
    inputs:
      input_1: 900000009
      input_2: 100000001

  - action: "assert_outputs"
    expected_outputs:
      output: 800000008

  - action: "set_inputs"
    inputs:
      input_1: -100000001
      input_2: 100000001

  - action: "assert_outputs"
    expected_outputs:
      output: -200000002
