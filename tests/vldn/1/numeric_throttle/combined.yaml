name: "combined deadband and discard"

config:
  min_change: 3
  discard_period: 0.5

steps:
  - action: "assert_outputs"
    comment: "Output starts at 0 (default)"
    expected_outputs:
      value: 0

  # Large enough change - passes deadband, starts cooldown
  - action: "set_inputs"
    comment: "Change by 5 from last output"
    inputs:
      value: 5

  - action: "assert_outputs"
    comment: "Output updated to 5"
    expected_outputs:
      value: 5

  # During cooldown: send same value - suppressed by discard period
  - action: "set_inputs"
    comment: "Same value during cooldown"
    inputs:
      value: 5

  - action: "assert_outputs"
    comment: "Output unchanged - in discard period"
    expected_outputs:
      value: 5

  - action: "wait"
    duration_ms: 550

  # Cooldown expired - deferred check: same value as output, diff = 0 < 3, no output
  - action: "assert_outputs"
    comment: "Output still 5 - deferred value same as output"
    expected_outputs:
      value: 5

  # Same value again after cooldown expired - not in cooldown, but diff = 0 < 3
  - action: "set_inputs"
    comment: "Same value after cooldown expired"
    inputs:
      value: 5

  - action: "assert_outputs"
    comment: "Output still 5 - deadband blocks (diff = 0)"
    expected_outputs:
      value: 5

  # Different value during cooldown, then same value before expiry
  - action: "set_inputs"
    comment: "Large change passes deadband, starts new cooldown"
    inputs:
      value: 10

  - action: "assert_outputs"
    comment: "Output updated to 10"
    expected_outputs:
      value: 10

  - action: "set_inputs"
    comment: "Different value during cooldown"
    inputs:
      value: 20

  - action: "set_inputs"
    comment: "Back to same value as output during cooldown"
    inputs:
      value: 10

  - action: "assert_outputs"
    comment: "Output unchanged - in discard period"
    expected_outputs:
      value: 10

  - action: "wait"
    duration_ms: 550

  # Cooldown expired - current input is 10 (same as output), diff = 0 < 3
  - action: "assert_outputs"
    comment: "Output still 10 - deferred value same as output, deadband blocks"
    expected_outputs:
      value: 10

  # Now send a genuinely different value after cooldown
  - action: "set_inputs"
    comment: "Change by 5 from last output of 10"
    inputs:
      value: 15

  - action: "assert_outputs"
    comment: "Output updated to 15"
    expected_outputs:
      value: 15
