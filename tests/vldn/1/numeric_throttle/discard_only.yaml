name: "discard only"

config:
  min_change: 0
  discard_period: 0.5

steps:
  - action: "assert_outputs"
    comment: "Output starts at 0 (default)"
    expected_outputs:
      value: 0

  # First value passes immediately (no cooldown active)
  - action: "set_inputs"
    comment: "Set value to 10"
    inputs:
      value: 10

  - action: "assert_outputs"
    comment: "Output updated to 10 (no cooldown yet)"
    expected_outputs:
      value: 10

  # Value during cooldown - should be suppressed
  - action: "set_inputs"
    comment: "Set value to 20 during cooldown"
    inputs:
      value: 20

  - action: "assert_outputs"
    comment: "Output unchanged - in discard period"
    expected_outputs:
      value: 10

  - action: "wait"
    duration_ms: 200

  # Still in cooldown (200ms < 500ms)
  - action: "set_inputs"
    comment: "Set value to 30 still during cooldown"
    inputs:
      value: 30

  - action: "assert_outputs"
    comment: "Output unchanged - still in discard period"
    expected_outputs:
      value: 10

  - action: "wait"
    duration_ms: 350

  # Cooldown expired - callback: input=30, output=10, diff=20 > 0 and >= 0
  # Deferred output restarts cooldown
  - action: "assert_outputs"
    comment: "Output updated to 30 (cooldown expired, deferred value passes)"
    expected_outputs:
      value: 30

  # New cooldown active from deferred output, no new inputs
  - action: "wait"
    duration_ms: 550

  # Callback fires: input=30, output=30, diff=0, diff > 0 is false
  # No output, cooldown ends naturally (infinite loop prevented by diff > 0 guard)
  - action: "assert_outputs"
    comment: "Output still 30 - callback found no change, cooldown ends"
    expected_outputs:
      value: 30

  # No cooldown active - next input passes immediately
  - action: "set_inputs"
    comment: "Set value to 40 (no cooldown active)"
    inputs:
      value: 40

  - action: "assert_outputs"
    comment: "Output updated to 40 immediately"
    expected_outputs:
      value: 40
