name: "zero_delay"

config:
  don: 0
  doff: 0

steps:
  - action: "set_inputs"
    inputs:
      input: false

  - action: "assert_outputs"
    expected_outputs:
      output: false

  - action: "set_inputs"
    inputs:
      input: true

  # With zero delay, output should be immediate
  - action: "assert_outputs"
    expected_outputs:
      output: true

  - action: "set_inputs"
    inputs:
      input: false

  # With zero delay, output should be immediate
  - action: "assert_outputs"
    expected_outputs:
      output: false
