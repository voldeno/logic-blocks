name: "trigger config"

config:
  trigger_on_input_1: true
  trigger_on_input_2: false

steps:
  - action: "assert_outputs"
    comment: "Output starts at 0 (default)"
    expected_outputs:
      output: 0

  # Non-triggering input captures value but does not produce output
  - action: "set_inputs"
    comment: "Set non-triggering input_2 to 100"
    inputs:
      input_2: 100

  - action: "assert_outputs"
    comment: "Output unchanged - input_2 is non-triggering"
    expected_outputs:
      output: 0

  # Triggering input uses the captured non-triggering value
  - action: "set_inputs"
    comment: "Set triggering input_1 to 5"
    inputs:
      input_1: 5

  - action: "assert_outputs"
    comment: "Output is 5 + 100 = 105"
    expected_outputs:
      output: 105

  # Another non-triggering update - no output change
  - action: "set_inputs"
    comment: "Update non-triggering input_2 to 200"
    inputs:
      input_2: 200

  - action: "assert_outputs"
    comment: "Output unchanged - input_2 is non-triggering"
    expected_outputs:
      output: 105

  # Triggering input picks up updated non-triggering value
  - action: "set_inputs"
    comment: "Set triggering input_1 to 10"
    inputs:
      input_1: 10

  - action: "assert_outputs"
    comment: "Output is 10 + 200 = 210"
    expected_outputs:
      output: 210
