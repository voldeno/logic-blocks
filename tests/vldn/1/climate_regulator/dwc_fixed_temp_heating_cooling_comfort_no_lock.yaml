name: "DWC (no lock), fixed temperature, heating & cooling, comfort"

config:
  thermal_mode: 0 # heating and cooling
  operation_mode: 1 # manual
  fixed_temp: 21.5
  comfort_heating_temp: 22.5
  comfort_cooling_temp: 24.5
  eco_heating_temp_diff: 2
  eco_cooling_temp_diff: 1
  dwc_delay: 1

steps:
  - action: "set_inputs"
    comment: "Current temperature: 21.5'"
    inputs:
      air_temp: 21.5
      outside_temp: 30

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp = fixed_temp - 0.0"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: 0

  - action: "set_inputs"
    comment: "Enable comfort temperature mode"
    inputs:
      comfort: true

  - action: "assert_outputs"
    comment: "TD out is in heating mode as air_temp < fixed_temp - 1.0"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 1.0

  - action: "set_inputs"
    comment: "Current temperature: 21.0'"
    inputs:
      air_temp: 21.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as air_temp < fixed_temp - 1.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 1.5

  - action: "set_inputs"
    comment: "Open window"
    inputs:
      dwc: true

  - action: "wait"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "TD out is still in heating mode as DWC was active for < DWC delay"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 1.5

  - action: "wait"
    duration_ms: 500

  - action: "assert_outputs"
    comment: "TD out is not going idle mode even though DWC was active for > DWC delay, as outside temp. is higher than the target"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 1.5

  - action: "set_inputs"
    comment: "Decrease outside temperature to affect negatively the heating"
    inputs:
      outside_temp: 10

  - action: "assert_outputs"
    comment: "TD out is idle mode as DWC is active long enough and outside temp. decreased below the target"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 0.0

  - action: "set_inputs"
    comment: "Increase outside temperature to affect positively the heating"
    inputs:
      outside_temp: 30

  - action: "assert_outputs"
    comment: "TD out is still in an idle mode to prevent fluctuations"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 0.0

  - action: "set_inputs"
    comment: "Decrease outside temperature to affect negatively the heating"
    inputs:
      outside_temp: 10

  - action: "assert_outputs"
    comment: "TD out is still in an idle mode to prevent fluctuations"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 0.0

  - action: "set_inputs"
    comment: "Close window"
    inputs:
      dwc: false

  - action: "wait"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "TD out is idle mode as DWC was deactivated less than 'DWC delay' ago"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 0.0

  - action: "wait"
    duration_ms: 120

  - action: "assert_outputs"
    comment: "TD out is back in heating mode as DWC was deactivated more than 'DWC delay' ago"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 1.5

  - action: "set_inputs"
    comment: "Current temperature: 20.5'"
    inputs:
      air_temp: 20.5

  - action: "assert_outputs"
    comment: "TD out is in heating mode as air_temp < fixed_temp - 2.0"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 2.0
