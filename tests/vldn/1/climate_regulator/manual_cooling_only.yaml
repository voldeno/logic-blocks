name: "manual, cooling only"

config:
  thermal_mode: 2 # cooling only
  operation_mode: 1 # manual
  comfort_heating_temp: 21.5
  comfort_cooling_temp: 21.5
  eco_heating_temp_diff: 0
  eco_cooling_temp_diff: 0

steps:
  - action: "set_inputs"
    comment: "Starting state: 19.0'"
    inputs:
      air_temp: 19.0

  - action: "assert_outputs"
    comment: "TD out is idle as air_temp < fixed_temp - 0.0"
    expected_outputs:
      target_temp: 19.0
      temp_deviation: 0

  - action: "set_inputs"
    comment: "Current temperature: 21.5'"
    inputs:
      air_temp: 21.5

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp = fixed_temp - 0.0"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: 0

  - action: "set_inputs"
    comment: "Current temperature: 22.0'"
    inputs:
      air_temp: 22.0

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as air_temp > fixed_temp - -0.5"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: -0.5

  - action: "set_inputs"
    comment: "Current temperature: 22.5'"
    inputs:
      air_temp: 22.5

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as air_temp > fixed_temp - -1.0"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: -1.0

  - action: "set_inputs"
    comment: "Current temperature: 23.0'"
    inputs:
      air_temp: 23.0

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as air_temp > fixed_temp - -1.5"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: -1.5

  - action: "set_inputs"
    comment: "Current temperature: 13.5'"
    inputs:
      air_temp: 23.5

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as air_temp > fixed_temp - -2.0"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: -2.0

  - action: "set_inputs"
    comment: "Current temperature: 25.0'"
    inputs:
      air_temp: 25.0

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as air_temp > fixed_temp - -3.5"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: -3.5

  - action: "set_inputs"
    comment: "Current temperature: 25.11'"
    inputs:
      air_temp: 25.11

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as air_temp > fixed_temp - -3.61"
    expected_outputs:
      target_temp: 21.5
      temp_deviation: -3.61
