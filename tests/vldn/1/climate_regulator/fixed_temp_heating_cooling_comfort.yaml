      target_temp: 22.5
      temp_deviation: 4.5

  - action: "set_inputs"
    comment: "Current temperature: 18.11'"
    inputs:
      air_temp: 18.11

  - action: "assert_outputs"
    comment: "TD out is in heating mode as air_temp < fixed_temp - 4.39"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 4.39

  - action: "set_inputs"
    comment: "Current temperature: 22.5'"
    inputs:
