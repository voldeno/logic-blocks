name: "manual, heating & cooling, protection & comfort"

config:
  thermal_mode: 0 # heating and cooling
  operation_mode: 1 # manual
  comfort_heating_temp: 22.5
  comfort_cooling_temp: 24.5
  eco_heating_temp_diff: 2
  eco_cooling_temp_diff: 1
  frost_protection_temp: 5
  overheat_protection_temp: 40

steps:
  - action: "set_inputs"
    comment: "Current temperature: 10.0'"
    inputs:
      air_temp: 10.0

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp > eco_heating_temp - 0.0"
    expected_outputs:
      target_temp: 20.5
      temp_deviation: 10.5

  - action: "set_inputs"
    comment: "Enable comfort and protection modes"
    inputs:
      comfort: true
      protection: true

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort takes priority and air_temp < comfort_heating_temp - 12.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 12.5

  - action: "set_inputs"
    comment: "Current temperature: 4.0'"
    inputs:
      air_temp: 4.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort takes priority and air_temp < comfort_heating_temp - 18.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 18.5

  - action: "set_inputs"
    comment: "Current temperature: 3.0'"
    inputs:
      air_temp: 3.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort takes priority and air_temp < comfort_heating_temp - 19.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 19.5

  - action: "set_inputs"
    comment: "Current temperature: 6.0'"
    inputs:
      air_temp: 6.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort takes priority and air_temp < comfort_heating_temp - 16.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 16.5

  - action: "set_inputs"
    comment: "Current temperature: 20.0'"
    inputs:
      air_temp: 20.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort takes priority and air_temp < comfort_heating_temp - 2.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 2.5

  - action: "set_inputs"
    comment: "Current temperature: 22.5'"
    inputs:
      air_temp: 22.5

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp = comfort_heating_temp - 0.0"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 0

  - action: "set_inputs"
    comment: "Current temperature: 24.5'"
    inputs:
      air_temp: 24.5

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp = comfort_cooling_temp - 0.0"
    expected_outputs:
      target_temp: 24.5
      temp_deviation: 0

  - action: "set_inputs"
    comment: "Current temperature: 35.0'"
    inputs:
      air_temp: 35.0

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as comfort takes priority and air_temp > comfort_cooling_temp - -10.5"
    expected_outputs:
      target_temp: 24.5
      temp_deviation: -10.5

  - action: "set_inputs"
    comment: "Current temperature: 39.0'"
    inputs:
      air_temp: 39.0

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as comfort takes priority and air_temp > comfort_cooling_temp - -14.5"
    expected_outputs:
      target_temp: 24.5
      temp_deviation: -14.5

  - action: "set_inputs"
    comment: "Current temperature: 40.1'"
    inputs:
      air_temp: 40.1

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as comfort takes priority and air_temp > comfort_cooling_temp - -15.6"
    expected_outputs:
      target_temp: 24.5
      temp_deviation: -15.6

  - action: "set_inputs"
    comment: "Current temperature: 41.0'"
    inputs:
      air_temp: 41.0

  - action: "set_inputs"
    comment: "Disable comfort mode, keep protection enabled"
    inputs:
      comfort: false
      protection: true

  - action: "assert_outputs"
    comment: "TD out is in cooling mode as protection is active and air_temp > protection_max_temp - -1.0"
    expected_outputs:
      target_temp: 40.0
      temp_deviation: -1.0

  - action: "set_inputs"
    comment: "Current temperature: 25.0'"
    inputs:
      air_temp: 25.0

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp > eco_heating_temp - 0.0 and < protection_max_temp"
    expected_outputs:
      target_temp: 25.0
      temp_deviation: 0

  - action: "set_inputs"
    comment: "Current temperature: 4.0'"
    inputs:
      air_temp: 4.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as air_temp < protection_min_temp (5.0) - 1.0"
    expected_outputs:
      target_temp: 5.0
      temp_deviation: 1.0

  - action: "set_inputs"
    comment: "Enable comfort mode again"
    inputs:
      comfort: true
      protection: true

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort is active and air_temp < protection_min_temp - 18.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 18.5

  - action: "set_inputs"
    comment: "Current temperature: 10.0'"
    inputs:
      air_temp: 10.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort takes priority and air_temp < comfort_heating_temp - 12.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 12.5

  - action: "set_inputs"
    comment: "Disable protection mode, keep comfort enabled"
    inputs:
      comfort: true
      protection: false

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort takes priority when temp is within protection range and air_temp < comfort_heating_temp - 12.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 12.5

  - action: "set_inputs"
    comment: "Current temperature: 4.0'"
    inputs:
      air_temp: 4.0

  - action: "assert_outputs"
    comment: "TD out is in heating mode as comfort is active and air_temp < comfort_heating_temp - 18.5"
    expected_outputs:
      target_temp: 22.5
      temp_deviation: 18.5

