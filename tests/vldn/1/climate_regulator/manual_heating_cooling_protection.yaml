    comment: "Current temperature: 10.0'"
    inputs:
      air_temp: 10.0

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp < eco_heating_temp - 10.5"
    expected_outputs:
      target_temp: 20.5
      temp_deviation: 10.5

  - action: "set_inputs"
    comment: "Enable protection mode"
    inputs:
      protection: true

  - action: "assert_outputs"
    comment: "TD out is in idle mode as air_temp > protection_min_temp (5.0) - 0.0"
    expected_outputs:
      target_temp: 10.0
      temp_deviation: 0

