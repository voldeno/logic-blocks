name: "base scenario"

steps:
  - action: "set_inputs"
    inputs:
      input: 3.2

  - action: "assert_outputs"
    expected_outputs:
      output: 3.2

  - action: "set_inputs"
    inputs:
      input: -3.2

  - action: "assert_outputs"
    expected_outputs:
      output: 3.2

  - action: "set_inputs"
    inputs:
      input: 0

  - action: "assert_outputs"
    expected_outputs:
      output: 0

  - action: "set_inputs"
    inputs:
      input: -100

  - action: "assert_outputs"
    expected_outputs:
      output: 100

  - action: "set_inputs"
    inputs:
      input: 100

  - action: "assert_outputs"
    expected_outputs:
      output: 100

  - action: "set_inputs"
    inputs:
      input: -0.5

  - action: "assert_outputs"
    expected_outputs:
      output: 0.5

  - action: "set_inputs"
    inputs:
      input: 0.5

  - action: "assert_outputs"
    expected_outputs:
      output: 0.5
