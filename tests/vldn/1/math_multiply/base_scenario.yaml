name: "base scenario"

steps:
  - action: "set_inputs"
    inputs:
      input_1: 3
      input_2: 2

  - action: "assert_outputs"
    expected_outputs:
      output: 6

  - action: "set_inputs"
    inputs:
      input_1: 1.2

  - action: "assert_outputs"
    expected_outputs:
      output: 2.4

  - action: "set_inputs"
    inputs:
      input_1: 2
      input_2: -0.1

  - action: "assert_outputs"
    expected_outputs:
      output: -0.2

  - action: "set_inputs"
    inputs:
      input_1: 0
      input_2: 0

  - action: "assert_outputs"
    expected_outputs:
      output: 0

  - action: "set_inputs"
    inputs:
      input_1: 100
      input_2: 101

  - action: "assert_outputs"
    expected_outputs:
      output: 10100
