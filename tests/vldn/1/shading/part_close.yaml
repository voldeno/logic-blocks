name: "part close"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  slightly_open_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait till the 100% opening duration"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should stop opening - 100% open"
    expected_outputs:
      open: false
      close: false
      position: 100

  - action: "set_inputs"
    comment: "Set part_close high"
    inputs:
      part_close: true

  - action: "wait"
    comment: "Wait for 20% closing duration"
    duration_ms: 210

  - action: "set_inputs"
    comment: "Set part_close low"
    inputs:
      part_close: false

  - action: "assert_outputs"
    comment: "Should be 20% closed and not moving"
    expected_outputs:
      open: false
      close: false
      position: 80

  - action: "wait"
    comment: "Wait a bit to confirm not moving"
    duration_ms: 300

  - action: "assert_outputs"
    comment: "Should not be moving after part_close release"
    expected_outputs:
      open: false
      close: false
      position: 80

  - action: "set_inputs"
    comment: "Set part_close high again"
    inputs:
      part_close: true

  - action: "wait"
    comment: "Wait for the rest of the closing duration - closing time is proportional to the current position"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should be still closing after full close to align to zero position"
    expected_outputs:
      open: false
      close: true
      position: 0

  - action: "wait"
    comment: "Wait a bit, but still withing the closing duration"
    duration_ms: 100

  - action: "assert_outputs"
    comment: "Should be still closing after full close to align to zero position"
    expected_outputs:
      open: false
      close: true
      position: 0

  - action: "wait"
    comment: "Wait till full closing duration"
    duration_ms: 200

  - action: "assert_outputs"
    comment: "Should not be moving after full closing, even if part_close wasn't released yet"
    expected_outputs:
      open: false
      close: false
      position: 0

  - action: "wait"
    comment: "Wait till full closing duration"
    duration_ms: 200

  - action: "assert_outputs"
    comment: "Should not be moving after full closing, even if part_close wasn't released yet - after extra wait"
    expected_outputs:
      open: false
      close: false
      position: 0

  - action: "set_inputs"
    comment: "Set part_close low"
    inputs:
      part_close: false

  - action: "assert_outputs"
    comment: "Should not be moving after the part_close release"
    expected_outputs:
      open: false
      close: false
      position: 0
