name: "full open stop"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  slightly_open_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait till the 100% closing duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Should stop closing - 100% closed"
    expected_outputs:
      open: false
      close: false
      position: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 120

  - action: "assert_outputs"
    comment: "Should be still opening - 10%"
    expected_outputs:
      open: true
      close: false
      position: 10

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 120

  - action: "assert_outputs"
    comment: "Should be still opening - 20%"
    expected_outputs:
      open: true
      close: false
      position: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input to stop movement - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input to stop movement - low"
    inputs:
      full_open: false

  - action: "assert_outputs"
    comment: "Should not be moving - position: 20%"
    expected_outputs:
      open: false
      close: false
      position: 20

  - action: "wait"
    comment: "Wait till the 100% opening duration"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "Should not move - position: 20%"
    expected_outputs:
      open: false
      close: false
      position: 20
