name: "toggle on full open, blinds"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0.2
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0
      slats: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still opening - 10%"
    expected_outputs:
      open: true
      close: false
      position: 10
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should stop moving"
    expected_outputs:
      open: false
      close: false
      position: 10
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start closing - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 10
      slats: 0

  - action: "wait"
    comment: "Wait 50% of full slats rotation time"
    duration_ms: 210

  - action: "assert_outputs"
    comment: "Should be still closing, slats horizontal"
    expected_outputs:
      open: false
      close: true
      position: 10
      slats: 50

  - action: "wait"
    comment: "Wait 50% of full slats rotation time"
    duration_ms: 210

  - action: "assert_outputs"
    comment: "Should be still closing, slats vertical in closing direction"
    expected_outputs:
      open: false
      close: true
      position: 10
      slats: 100

  - action: "wait"
    comment: "Wait 10% of closing time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Calibration is on opening now - closing moves only the calculated part and stops at 0"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "wait"
    comment: "Confirm it stays stopped"
    duration_ms: 910

  - action: "assert_outputs"
    comment: "Should be closed, not moving"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0
