name: "toggle to end positions"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  slightly_open_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start opening - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0

  - action: "wait"
    comment: "Wait full opening duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Should be fully open and switched off"
    expected_outputs:
      open: false
      close: false
      position: 100

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start closing - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 100

  - action: "wait"
    comment: "Wait full closing duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Should be fully closed and switched off"
    expected_outputs:
      open: false
      close: false
      position: 0

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start opening - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0

  - action: "wait"
    comment: "Wait full opening duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Should be fully open and switched off"
    expected_outputs:
      open: false
      close: false
      position: 100
