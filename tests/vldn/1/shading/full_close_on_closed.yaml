name: "full close on fully closed"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait till the 100% closing duration"
    duration_ms: 1020

  - action: "assert_outputs"
    comment: "Should stop closing - 100% closed"
    expected_outputs:
      open: false
      close: false
      position: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Calibration is on opening now - closing an already closed blind is a no-op"
    expected_outputs:
      open: false
      close: false
      position: 0

  - action: "wait"
    comment: "Wait to confirm nothing happens"
    duration_ms: 1120

  - action: "assert_outputs"
    comment: "Still closed and not moving"
    expected_outputs:
      open: false
      close: false
      position: 0
