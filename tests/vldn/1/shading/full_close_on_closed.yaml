name: "full close on fully closed"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait till the 100% closing duration"
    duration_ms: 1020

  - action: "assert_outputs"
    comment: "Should stop closing - 100% closed"
    expected_outputs:
      open: false
      close: false
      position: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 0

  - action: "wait"
    comment: "Wait for 10% move"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should keep close active for the full closing duration, even if position is already 0"
    expected_outputs:
      open: false
      close: true
      position: 0

  - action: "wait"
    comment: "Wait for the rest of the whole closing duration"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should stop closing after the full closing duration passed"
    expected_outputs:
      open: false
      close: false
      position: 0
