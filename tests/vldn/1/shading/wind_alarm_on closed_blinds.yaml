name: "wind alarm on closed, blinds"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0.2
  motor_lock_duration: 0
  wind_alarm_position: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait till opening stops"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be open, not moving"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait till closing stops"
    duration_ms: 1410

  - action: "assert_outputs"
    comment: "Should be closed, not moving"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Set wind_alarm input high"
    inputs:
      wind_alarm: true

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Calibration is on opening now - a wind alarm to the already-reached closed position is a no-op"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "wait"
    comment: "Wait to confirm nothing moves"
    duration_ms: 1430

  - action: "assert_outputs"
    comment: "Should not move"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0