name: "full open on slightly closed"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  slightly_open_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait till the 100% opening duration"
    duration_ms: 1200

  - action: "assert_outputs"
    comment: "Should stop opening - 100% open"
    expected_outputs:
      open: false
      close: false
      position: 100

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait till 10% closed"
    duration_ms: 120

  - action: "set_inputs"
    comment: "Send a pulse to off input - high"
    inputs:
      off: true

  - action: "wait"
    comment: "Send a pulse to off input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to off input - low"
    inputs:
      off: false

  - action: "assert_outputs"
    comment: "Should stop moving and be 10% closed"
    expected_outputs:
      open: false
      close: false
      position: 90

  - action: "wait"
    comment: "Wait a bit to confirm it's not moving anymore"
    duration_ms: 500

  - action: "assert_outputs"
    comment: "Should stop moving and be 10% closed"
    expected_outputs:
      open: false
      close: false
      position: 90

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 90

  - action: "wait"
    comment: "Wait for 10% move"
    duration_ms: 120

  - action: "assert_outputs"
    comment: "Should open the remaining part from current position, but should not stop when opening"
    expected_outputs:
      open: true
      close: false
      position: 100

  - action: "wait"
    comment: "Wait for 10% move"
    duration_ms: 120

  - action: "assert_outputs"
    comment: "Should keep open active for the full opening duration, even if position is 100"
    expected_outputs:
      open: true
      close: false
      position: 100

  - action: "wait"
    comment: "Wait for the rest of the whole opening duration"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "Should stop opening after the full opening duration passed"
    expected_outputs:
      open: false
      close: false
      position: 100
