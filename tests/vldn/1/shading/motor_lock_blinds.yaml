name: "motor lock for venetian blinds"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 1 # full slats rotation takes 2s - keeps the reversal window wide
  motor_lock_duration: 1 # long lock so the asserts sit far from the lock boundary

steps:
  - action: "set_inputs"
    comment: "Send a pulse to slightly_open input - high"
    inputs:
      slightly_open: true

  - action: "wait"
    comment: "Send a pulse to slightly_open input - wait"
    duration_ms: 5

  - action: "set_inputs"
    comment: "Send a pulse to slightly_open input - low"
    inputs:
      slightly_open: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0
      slats: 0

  - action: "wait"
    comment: "Wait 10% opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be 10% open and opening"
    expected_outputs:
      open: true
      close: false
      position: 10
      slats: 0

  - action: "wait"
    comment: "Wait till full opening time"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "Should be 100% open and stopped for the motor lock duration"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "wait"
    comment: "Wait roughly half of the motor lock duration"
    duration_ms: 500

  - action: "assert_outputs"
    comment: "Should still be stopped, well within the motor lock duration"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "wait"
    comment: "Wait past the motor lock so the slats reversal is under way"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "Should be reversing (closing) the slats after the motor lock passed"
    expected_outputs:
      open: false
      close: true
      position: 100

  - action: "wait"
    comment: "Wait till the slats reach the slightly open position"
    duration_ms: 900

  - action: "assert_outputs"
    comment: "Should be slightly open, not moving"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 50

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start closing (same direction as the slats reversal, so no motor lock)"
    expected_outputs:
      open: false
      close: true
      position: 100
      slats: 50

  - action: "wait"
    comment: "Wait for the remaining 50% of slats rotation"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Slats should be closed"
    expected_outputs:
      open: false
      close: true
      position: 100
      slats: 100

  - action: "wait"
    comment: "Wait 10% closing time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be 10% closed and closing"
    expected_outputs:
      open: false
      close: true
      position: 90
      slats: 100

  - action: "wait"
    comment: "Wait till fully closed"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be closed"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0
