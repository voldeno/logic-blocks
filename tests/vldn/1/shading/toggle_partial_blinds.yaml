name: "toggle partial, blinds"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 1
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start opening - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0

  - action: "wait"
    comment: "Wait 30% of opening time"
    duration_ms: 310

  - action: "assert_outputs"
    comment: "Should be still opening - 30%"
    expected_outputs:
      open: true
      close: false
      position: 30
      slats: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still opening - 40%"
    expected_outputs:
      open: true
      close: false
      position: 40
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should not be moving"
    expected_outputs:
      open: false
      close: false
      position: 40
      slats: 0

  - action: "wait"
    comment: "Wait a bit to confirm"
    duration_ms: 300

  - action: "assert_outputs"
    comment: "Should not be moving - after wait"
    expected_outputs:
      open: false
      close: false
      position: 40
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start closing - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 40
      slats: 0

  - action: "wait"
    comment: "Wait 50% of full slats rotation time"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be still closing, slats horizontal"
    expected_outputs:
      open: false
      close: true
      position: 40
      slats: 50

  - action: "wait"
    comment: "Wait 50% of full slats rotation time"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be still closing, slats vertical in closing direction"
    expected_outputs:
      open: false
      close: true
      position: 40
      slats: 100

  - action: "wait"
    comment: "Wait 10% of closing time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still closing - 30%"
    expected_outputs:
      open: false
      close: true
      position: 30
      slats: 100

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should not be moving"
    expected_outputs:
      open: false
      close: false
      position: 30
      slats: 100

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start opening - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 30
      slats: 100

  - action: "wait"
    comment: "Wait 50% of full slats rotation time"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be still opening, slats horizontal"
    expected_outputs:
      open: true
      close: false
      position: 30
      slats: 50

  - action: "wait"
    comment: "Wait 50% of full slats rotation time"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be still opening, slats vertical in opening direction"
    expected_outputs:
      open: true
      close: false
      position: 30
      slats: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still opening - 40%"
    expected_outputs:
      open: true
      close: false
      position: 40
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should not be moving"
    expected_outputs:
      open: false
      close: false
      position: 40
      slats: 0