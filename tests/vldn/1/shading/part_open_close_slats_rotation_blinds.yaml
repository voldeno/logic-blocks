name: "part open, part close with slats rotation for blinds"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0.8
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait till the 100% closing duration (full close time + full slats time on close)"
    duration_ms: 2610

  - action: "assert_outputs"
    comment: "Should stop closing - 100% closed"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Set part_open high"
    inputs:
      part_open: true

  - action: "wait"
    comment: "Wait for 30% opening duration"
    duration_ms: 310

  - action: "set_inputs"
    comment: "Set part_open low"
    inputs:
      part_open: false

  - action: "assert_outputs"
    comment: "Should be 30% open and not moving"
    expected_outputs:
      open: false
      close: false
      position: 30
      slats: 0

  - action: "wait"
    comment: "Wait a bit to confirm not moving"
    duration_ms: 200

  - action: "assert_outputs"
    comment: "Should not be moving after part_open release"
    expected_outputs:
      open: false
      close: false
      position: 30
      slats: 0

  - action: "set_inputs"
    comment: "Set part_close high"
    inputs:
      part_close: true

  - action: "wait"
    comment: "Wait for 50% of slats rotation duration"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should be 30% open with horizontal slats"
    expected_outputs:
      open: false
      close: true
      position: 30
      slats: 50

  - action: "wait"
    comment: "Wait for full slats rotation duration to align vertical in closing direction"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should be 30% open with slats fully rotated to closing direction"
    expected_outputs:
      open: false
      close: true
      position: 30
      slats: 100

  - action: "wait"
    comment: "Wait 10% of closing duration"
    duration_ms: 110

  - action: "set_inputs"
    comment: "Set part_close low"
    inputs:
      part_close: false

  - action: "assert_outputs"
    comment: "Should be 20% open and not moving"
    expected_outputs:
      open: false
      close: false
      position: 20
      slats: 100

  - action: "wait"
    comment: "Wait a bit for re-check"
    duration_ms: 200

  - action: "assert_outputs"
    comment: "Should be 20% open and not moving - after wait"
    expected_outputs:
      open: false
      close: false
      position: 20
      slats: 100

  - action: "set_inputs"
    comment: "Set part_open high"
    inputs:
      part_open: true

  - action: "wait"
    comment: "Wait for 50% of slats rotation duration"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should be 20% open with horizontal slats"
    expected_outputs:
      open: true
      close: false
      position: 20
      slats: 50

  - action: "wait"
    comment: "Wait for full slats rotation duration to align vertical in opening direction"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should be 20% open with slats fully rotated to opening direction"
    expected_outputs:
      open: true
      close: false
      position: 20
      slats: 0

  - action: "wait"
    comment: "Wait till full opening duration"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be fully open and not be moving"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "set_inputs"
    comment: "Set part_open low"
    inputs:
      part_open: false

  - action: "assert_outputs"
    comment: "Should not be moving after the part_open release"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "set_inputs"
    comment: "Set part_open high"
    inputs:
      part_open: true

  - action: "assert_outputs"
    comment: "Should be fully open and not be moving"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "set_inputs"
    comment: "Set part_open low"
    inputs:
      part_open: false

  - action: "assert_outputs"
    comment: "Should not be moving after the part_open release"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0
