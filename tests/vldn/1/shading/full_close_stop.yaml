name: "full close stop"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  slightly_open_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait till the 100% opening duration"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should stop opening - 100% open"
    expected_outputs:
      open: false
      close: false
      position: 100

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 100

  - action: "wait"
    comment: "Wait 10% of closing time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still closing - 90%"
    expected_outputs:
      open: false
      close: true
      position: 90

  - action: "wait"
    comment: "Wait 10% of closing time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still closing - 80%"
    expected_outputs:
      open: false
      close: true
      position: 80

  - action: "set_inputs"
    comment: "Send a pulse to full_close input to stop movement - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input to stop movement - low"
    inputs:
      full_close: false

  - action: "assert_outputs"
    comment: "Should not be moving - position: 80%"
    expected_outputs:
      open: false
      close: false
      position: 80

  - action: "wait"
    comment: "Wait till the 100% closing duration"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should not move - position: 80%"
    expected_outputs:
      open: false
      close: false
      position: 80
