name: "toggle on full close, blinds"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0.2
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait 100% of opening time to set init position for the test"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should be open"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 100
      slats: 0

  - action: "wait"
    comment: "Wait 50% of full slats rotation time - 1"
    duration_ms: 210

  - action: "assert_outputs"
    comment: "Should be still closing, slats horizontal"
    expected_outputs:
      open: false
      close: true
      position: 100
      slats: 50

  - action: "wait"
    comment: "Wait 50% of full slats rotation time - 2"
    duration_ms: 210

  - action: "assert_outputs"
    comment: "Should be still closing, slats vertical in closing direction"
    expected_outputs:
      open: false
      close: true
      position: 100
      slats: 100

  - action: "wait"
    comment: "Wait 10% of closing time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still closing - 10%"
    expected_outputs:
      open: false
      close: true
      position: 90
      slats: 100

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should stop moving"
    expected_outputs:
      open: false
      close: false
      position: 90
      slats: 100

  - action: "wait"
    comment: "Wait to re-check"
    duration_ms: 200

  - action: "assert_outputs"
    comment: "Should stop moving - re-check"
    expected_outputs:
      open: false
      close: false
      position: 90
      slats: 100

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start opening - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - low"
    inputs:
      toggle: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 90
      slats: 100

  - action: "wait"
    comment: "Wait 50% of full slats rotation time - 3"
    duration_ms: 210

  - action: "assert_outputs"
    comment: "Should be still opening, slats horizontal"
    expected_outputs:
      open: true
      close: false
      position: 90
      slats: 50

  - action: "wait"
    comment: "Wait 50% of full slats rotation time - 4"
    duration_ms: 210

  - action: "assert_outputs"
    comment: "Should be still opening, slats vertical in closing direction"
    expected_outputs:
      open: true
      close: false
      position: 90
      slats: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Opening overshoots for the full opening duration (calibration towards the open end-stop)"
    expected_outputs:
      open: true
      close: false
      position: 100
      slats: 0

  - action: "wait"
    comment: "Wait the rest of the full opening duration"
    duration_ms: 910

  - action: "assert_outputs"
    comment: "Should stop opening at the fully open position"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0
