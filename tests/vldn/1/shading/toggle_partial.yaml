name: "toggle partial"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  slightly_open_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start opening - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start opening - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still opening - 10%"
    expected_outputs:
      open: true
      close: false
      position: 10

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still opening - 20%"
    expected_outputs:
      open: true
      close: false
      position: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should not be moving"
    expected_outputs:
      open: false
      close: false
      position: 20

  - action: "wait"
    comment: "Wait 20% of opening time"
    duration_ms: 210

  - action: "assert_outputs"
    comment: "Should not be moving - after wait"
    expected_outputs:
      open: false
      close: false
      position: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to start closing - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to start closing - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 20

  - action: "wait"
    comment: "Wait 10% of closing time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still closing - 10%"
    expected_outputs:
      open: false
      close: true
      position: 10

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input to stop movement - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input to stop movement - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should not be moving"
    expected_outputs:
      open: false
      close: false
      position: 10
