name: "full open on fully open"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait till the 100% opening duration"
    duration_ms: 1020

  - action: "assert_outputs"
    comment: "Should stop opening - 100% open"
    expected_outputs:
      open: false
      close: false
      position: 100

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start opening (calibration / auto-correction towards the open end-stop)"
    expected_outputs:
      open: true
      close: false
      position: 100

  - action: "wait"
    comment: "Wait for 10% move"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should keep open active for the full opening duration, even if position is already 100"
    expected_outputs:
      open: true
      close: false
      position: 100

  - action: "wait"
    comment: "Wait for the rest of the whole opening duration"
    duration_ms: 1010

  - action: "assert_outputs"
    comment: "Should stop opening after the full opening duration passed"
    expected_outputs:
      open: false
      close: false
      position: 100
