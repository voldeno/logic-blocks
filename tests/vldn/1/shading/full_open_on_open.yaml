name: "full open on open"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 10
  slightly_open_duration: 0.3
  motor_lock_duration: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0
      slats: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still opening - 10%"
    expected_outputs:
      open: true
      close: false
      position: 10
      slats: 0

  - action: "wait"
    comment: "Wait 10% of opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be still opening - 20%"
    expected_outputs:
      open: true
      close: false
      position: 20
      slats: 0

  - action: "wait"
    comment: "Wait till the 100% opening duration"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should stop opening - 100% open"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "assert_outputs"
    comment: "Should not move"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0
