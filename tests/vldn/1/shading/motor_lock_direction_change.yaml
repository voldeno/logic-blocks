name: "motor lock on immediate direction change of the motor movement"

config:
  shading_type: 1 # roller blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0.2
  motor_lock_duration: 0.5

steps:
  - action: "assert_outputs"
    comment: "Should be full_closed"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start opening"
    expected_outputs:
      open: true
      close: false
      position: 0
      slats: 0

  - action: "wait"
    comment: "Wait 10% opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should be 10% open and opening"
    expected_outputs:
      open: true
      close: false
      position: 10
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should be 10% open and stopped"
    expected_outputs:
      open: false
      close: false
      position: 10
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should be 10% open and opening - no motor lock on movement to the same direction"
    expected_outputs:
      open: true
      close: false
      position: 10
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should be 10% open and stopped"
    expected_outputs:
      open: false
      close: false
      position: 10
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - high"
    inputs:
      full_close: true

  - action: "wait"
    comment: "Send a pulse to full_close input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_close input - low"
    inputs:
      full_close: false

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should not start closing due to motor lock on direction change"
    expected_outputs:
      open: false
      close: false
      position: 10
      slats: 0

  - action: "wait"
    comment: "Wait for motor lock to pass"
    duration_ms: 500

  - action: "assert_outputs"
    comment: "Should be 10% open and closing"
    expected_outputs:
      open: false
      close: true
      position: 10
      slats: 0

  - action: "wait"
    comment: "Wait 10% opening time"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Calibration is on opening now - closing moves only the calculated part and stops at 0"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "wait"
    comment: "Confirm it stays stopped"
    duration_ms: 950

  - action: "assert_outputs"
    comment: "Should be closed and stopped"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0
