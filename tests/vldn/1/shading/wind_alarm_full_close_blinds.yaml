name: "wind alarm to fully closed, blinds"

config:
  shading_type: 0 # venetian blinds
  opening_duration: 1
  closing_duration: 1
  return_duration: 0.4
  motor_lock_duration: 0
  wind_alarm_position: 0

steps:
  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait till the 80% opening duration"
    duration_ms: 810

  - action: "set_inputs"
    comment: "Send a pulse to off input - high"
    inputs:
      off: true

  - action: "wait"
    comment: "Send a pulse to off input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to off input - low"
    inputs:
      off: false

  - action: "assert_outputs"
    comment: "Should stop opening - 80% open"
    expected_outputs:
      open: false
      close: false
      position: 80
      slats: 0

  - action: "set_inputs"
    comment: "Set wind_alarm input high"
    inputs:
      wind_alarm: true

  - action: "wait"
    comment: "Wait for callbacks to process"
    duration_ms: 5

  - action: "assert_outputs"
    comment: "Should start closing"
    expected_outputs:
      open: false
      close: true
      position: 80
      slats: 0

  - action: "wait"
    comment: "Wait for 50% of slats rotation duration"
    duration_ms: 410

  - action: "assert_outputs"
    comment: "Should be 80% open with horizontal slats"
    expected_outputs:
      open: false
      close: true
      position: 80
      slats: 50

  - action: "wait"
    comment: "Wait for full slats rotation duration to align vertical in closing direction"
    duration_ms: 410

  - action: "assert_outputs"
    comment: "Should be 80% open with slats fully rotated to closing direction"
    expected_outputs:
      open: false
      close: true
      position: 80
      slats: 100

  - action: "wait"
    comment: "Wait the rest of the closing duration"
    duration_ms: 810

  - action: "assert_outputs"
    comment: "Should move into wind_alarm_position and continue closing if wind_alarm_position=0 (full close)"
    expected_outputs:
      open: false
      close: true
      position: 0
      slats: 0

  - action: "wait"
    comment: "Wait the rest of the closing duration"
    duration_ms: 410

  - action: "assert_outputs"
    comment: "Should move into full close position if wind_alarm_position=0"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "assert_outputs"
    comment: "Should stay closed and not react to any movement triggers"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Send a pulse to toggle input - high"
    inputs:
      toggle: true

  - action: "wait"
    comment: "Send a pulse to toggle input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to toggle input - low"
    inputs:
      toggle: false

  - action: "assert_outputs"
    comment: "Should stay closed and not react to any movement triggers"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Set part_open input high"
    inputs:
      part_open: true

  - action: "assert_outputs"
    comment: "Should stay closed and not react to any movement triggers"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Set part_open input low"
    inputs:
      part_open: false

  - action: "set_inputs"
    comment: "Send a pulse to slightly_open input - high"
    inputs:
      slightly_open: true

  - action: "wait"
    comment: "Send a pulse to slightly_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to slightly_open input - low"
    inputs:
      slightly_open: false

  - action: "assert_outputs"
    comment: "Should stay closed and not react to any movement triggers"
    expected_outputs:
      open: false
      close: false
      position: 0
      slats: 0

  - action: "set_inputs"
    comment: "Set wind_alarm input low"
    inputs:
      wind_alarm: false

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - high"
    inputs:
      full_open: true

  - action: "wait"
    comment: "Send a pulse to full_open input - wait"
    duration_ms: 20

  - action: "set_inputs"
    comment: "Send a pulse to full_open input - low"
    inputs:
      full_open: false

  - action: "wait"
    comment: "Wait till the 10% opening duration"
    duration_ms: 110

  - action: "assert_outputs"
    comment: "Should start reacting to movement triggers after wind alarm was removed"
    expected_outputs:
      open: true
      close: false
      position: 10
      slats: 0

  - action: "wait"
    comment: "Wait till the 100% opening duration"
    duration_ms: 910

  - action: "assert_outputs"
    comment: "Should start reacting to movement triggers after wind alarm was removed"
    expected_outputs:
      open: false
      close: false
      position: 100
      slats: 0
