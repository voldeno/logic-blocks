name: "extract string values"

config:
  path: "location"

steps:
  - action: "set_inputs"
    comment: "Simple string extraction"
    inputs:
      json: '{"location": "Salon", "temperature": 22.5}'

  - action: "assert_outputs"
    comment: "Extracted string value"
    expected_outputs:
      value: "Salon"

  - action: "set_inputs"
    comment: "Update JSON with new value"
    inputs:
      json: '{"location": "Kitchen", "temperature": 19.0}'

  - action: "assert_outputs"
    comment: "Value updates on new input"
    expected_outputs:
      value: "Kitchen"
