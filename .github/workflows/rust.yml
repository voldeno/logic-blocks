name: Rust
on:
  workflow_dispatch:
  pull_request:
    branches: [ "develop" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/voldeno/checker:latest
    steps:
    - uses: actions/checkout@v3
    - name: Check scripts
      run: validator --resources blocks
    - name: Run tests
      run: logic_tests_runner --resources blocks 
